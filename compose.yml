services:
  dashboard:
    build:
      context: .
      dockerfile: dockerfiles/dashboard.Dockerfile
    ports:
      - "8050:8050"
    env_file:
      - .env
    environment:
      - SOURCE_DB_HOST=${SOURCE_DB_HOST}
      - SOURCE_DB_PORT=${SOURCE_DB_PORT}
      - SOURCE_DB_NAME=${SOURCE_DB_NAME}
      - SOURCE_DB_USER=${SOURCE_DB_USER}
      - SOURCE_DB_PASS=${SOURCE_DB_PASS}
    volumes:
      - ./dashboard:/app/
    networks:
      - app-network   

  zookeeper:
    image: confluentinc/cp-zookeeper:7.9.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - app-network
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka-init:
    image: confluentinc/cp-zookeeper:7.9.0    # ← version pin
    depends_on:
      zookeeper:
        condition: service_healthy
    networks:
      - app-network
    entrypoint:
      - sh
      - -c
      - |
          echo 'Clearing stale Kafka broker registration...'
          zookeeper-shell zookeeper:2181 rmr /brokers/ids/1 || true
          echo 'Done.'

  kafka:
    image: confluentinc/cp-kafka:7.9.0
    hostname: kafka
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      zookeeper:
        condition: service_healthy
    restart: on-failure
    ports:
      - "9092:9092"
    networks:
      - app-network
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ENABLE_KRAFT: 'false'

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'

      KAFKA_REPLICA_LAG_TIME_MAX_MS: 60000
      KAFKA_CONNECTIONS_MAX_IDLE_MS: 540000
      KAFKA_REQUEST_TIMEOUT_MS: 60000
      KAFKA_SESSION_TIMEOUT_MS: 60000
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:29092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 10

  kafka-topics-init:
    image: confluentinc/cp-kafka:7.9.0
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - app-network
    env_file:
      - .env
    environment:
      TOPIC_PREFIX: ${TOPIC_PREFIX}
    entrypoint:
      - sh
      - -c
      - |
          echo 'Pre-creating Kafka topics with prefix: $${TOPIC_PREFIX}...'
          for TABLE in customers orders order_items order_payments order_reviews products sellers; do
            TOPIC="$${TOPIC_PREFIX}.public.$${TABLE}"
            kafka-topics --bootstrap-server kafka:29092 \
              --create --if-not-exists \
              --topic "$$TOPIC" \
              --partitions 1 \
              --replication-factor 1
            echo "Created: $$TOPIC"
          done
          echo 'All topics ready.'

  kafka-connect:
    image: debezium/connect:2.7.3.Final
    hostname: kafka-connect
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8083:8083"
    networks:
      - app-network
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: debezium-connect-group
      CONFIG_STORAGE_TOPIC: debezium_configs
      OFFSET_STORAGE_TOPIC: debezium_offsets
      STATUS_STORAGE_TOPIC: debezium_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/connectors"]
      interval: 15s
      timeout: 10s
      retries: 10

  debezium-init:
    image: alpine:3.19
    depends_on:
      kafka-connect:
        condition: service_healthy
      kafka-topics-init:
        condition: service_completed_successfully
    networks:
      - app-network
    env_file:
      - .env
    volumes:
      - ./debezium:/debezium-config
    restart: on-failure
    entrypoint:
      - sh
      - -c
      - |
          apk add --no-cache curl gettext postgresql-client

          echo 'Generating connector config from template...'
          TOPIC_PREFIX=$(echo "$TOPIC_PREFIX" | tr '[:upper:]' '[:lower:]')
          export TOPIC_PREFIX
          envsubst < /debezium-config/postgres-connector.json > /tmp/connector.json

          echo 'Waiting for database to be ready...'
          until pg_isready -h "$SOURCE_DB_HOST" -p "${SOURCE_DB_PORT:-5432}" -U "$SOURCE_DB_USER" -d "$SOURCE_DB_NAME"; do
            echo 'Database not ready, retrying in 5s...'
            sleep 5
          done
          echo 'Database is ready!'

          echo 'Registering connector...'
          until curl -s -X POST http://kafka-connect:8083/connectors \
            -H "Content-Type: application/json" \
            -d @/tmp/connector.json | grep -q '"name":"postgres-connector"'; do
            echo 'Registration failed, retrying in 10s...'
            sleep 10
          done

          echo 'Connector registered successfully.'

          echo 'Waiting 15s for connector to stabilize...'
          sleep 15


  spark-master:
    image: apache/spark:3.5.1
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    networks:
      - app-network
    ports:
      - "8081:8080"
      - "7077:7077"
    healthcheck:  
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 10s
      timeout: 5s
      retries: 10

  spark-worker:
    image: apache/spark:3.5.1
    depends_on:
      spark-master:
        condition: service_healthy
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    networks:
      - app-network
    ports:
      - "8082:8081"

  streaming-app:
    build:
      context: .
      dockerfile: dockerfiles/spark_app.Dockerfile
    env_file:
      - .env
    networks:
      - app-network
    depends_on:
      kafka:
        condition: service_healthy
      spark-master:
        condition: service_healthy
      spark-worker:
        condition: service_started 
      debezium-init:
        condition: service_completed_successfully
      kafka-topics-init:
        condition: service_completed_successfully
    volumes:
      - ./checkpoints:/app/checkpoints
    restart: on-failure 
    entrypoint:
      - /opt/spark/bin/spark-submit
      - --master
      - spark://spark-master:7077
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1,org.postgresql:postgresql:42.7.2
      - --conf
      - spark.sql.shuffle.partitions=4 
      - --conf
      - spark.streaming.stopGracefullyOnShutdown=true
      - /app/spark_app.py


networks:
  app-network:
    driver: bridge

volumes:
  zookeeper-data:
  zookeeper-log:
  kafka-data: